services:
  tralha:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
      - "8001:8001"
    volumes:
      - tralha-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256

  postgres:
    image: postgres:17-alpine
    profiles: [postgres]
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: tralha
      POSTGRES_DB: tralha
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  tralha-data:
  postgres-data:
