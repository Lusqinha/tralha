[project]
name = "tralha"
version = "0.2.0"
description = "Tool for Remote Artifact Linking & Hosting for AIs"
readme = "README.md"
license = "AGPL-3.0-only"
authors = [
    { name = "Lucas Borges", email = "lucas18sborges@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "fastmcp>=4.1.4",
    "jinja2>=3.1.6",
    "markdown-it-py>=4.2.0",
    "nh3>=0.3.7",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.6",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
tralha = "tralha.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
"src/tralha/storage.py" = ["SIM115"]
